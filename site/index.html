<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const cfg = window.MATH_LEARN_CONFIG || {};

const sb = createClient(cfg.url, cfg.publishableKey);

const S={session:null,profile:null,classes:[],cls:null,channels:[],channel:null,messages:[],members:[],posts:[],topics:[],replies:{},theme:localStorage.getItem('lm-theme')||'dark',modal:'',toastTimer:null,rt:null,notifyRt:null,presence:null,online:new Set(),draft:'',upload:null,forumFile:null,role:'',tour:0,canvas:null,menu:false,context:null,gameResult:'',gameBusy:false,gameMode:'wheel',gameOptions:'Học sinh 1\nHọc sinh 2\nHọc sinh 3\nHọc sinh 4',gameWinnerIndex:-1,wheelAngle:0};

async function edge(name,body){const {data,error}=await sb.functions.invoke(name,{body});if(error){let message=error.message||`Không gọi được chức năng ${name}.`;try{const detail=await error.context?.json();if(detail?.error)message=detail.error}catch{}throw Error(message)}return data}

function enhanceCustomSelects(){ $$('select:not([data-custom-select])').forEach((select,index)=>{select.dataset.customSelect='true';if(!select.id)select.id=`lm-select-${Date.now()}-${index}`;select.classList.add('native-select');const wrap=document.createElement('div');wrap.className='select-wrap';select.parentNode.insertBefore(wrap,select);wrap.appendChild(select);const trigger=document.createElement('button');trigger.type='button';trigger.className='custom-select-trigger';trigger.dataset.action='toggle-custom-select';trigger.dataset.selectId=select.id;trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');trigger.innerHTML=`<span class="custom-select-current">${esc(select.options[select.selectedIndex]?.text||'Chọn')}</span><span class="custom-select-caret">⌄</span>`;const menu=document.createElement('div');menu.className='custom-select-menu hidden';menu.dataset.selectMenu=select.id;menu.setAttribute('role','listbox');[...select.options].forEach(option=>{const item=document.createElement('button');item.type='button';item.className='custom-select-option';item.dataset.action='choose-custom-select';item.dataset.selectId=select.id;item.dataset.value=option.value;item.setAttribute('role','option');item.setAttribute('aria-selected',String(option.selected));item.textContent=option.text;menu.append(item)});wrap.append(trigger,menu)});}
function decorateGlowBoxes(){$$('.topbar,.rail,.channels,.chat,.members,.home,.class-row,.channel,.class-head,.member,.msg,.forum-card,.home-card,.modal,.auth-card,.compose,.role-card,.role-entry,.about-card,.top-menu button,.game-stage,.game-mode-picks button').forEach(el=>el.classList.add('glow-box'))}
function installBorderTraces(){const ns='http://www.w3.org/2000/svg';$$('.glow-box:not([data-border-trace])').forEach(box=>{box.dataset.borderTrace='true';const svg=document.createElementNS(ns,'svg');svg.classList.add('border-trace');svg.setAttribute('aria-hidden','true');const radius=Math.max(0,parseFloat(getComputedStyle(box).borderTopLeftRadius)||0);for(const kind of ['tail','head']){const rect=document.createElementNS(ns,'rect');rect.setAttribute('x','1');rect.setAttribute('y','1');rect.setAttribute('width','calc(100% - 2px)');rect.setAttribute('height','calc(100% - 2px)');rect.setAttribute('rx',String(radius));rect.setAttribute('pathLength','1000');rect.classList.add(`border-trace-${kind}`);svg.appendChild(rect)}box.appendChild(svg)})}

cher'||owner()?'<button class="primary" data-action="create-class">＋ Tạo lớp học</button>':''}${S.profile?.role==='student'?'<button class="primary" data-action="join-class">Tham gia lớp</button>':''}${owner()?'<button class="secondary" data-action="reload-classes">Tải lại tất cả lớp</button>':''}</div></div></main>`}</div></div>${S.modal?renderModal():''}${S.tour?renderTour():''}`;

function renderMessages(){return `<section class="messages" id="messages">${S.messages.length?S.messages.map(messageHtml).join(''):`<div class="welcome"><div class="hero-icon">✦</div><h3>Bắt đầu cuộc trò chuyện</h3><p>Chào mừng bạn đến với <b>#${esc(S.channel?.name||'')}</b>.<br>Hãy hỏi một câu Toán học nhé.</p></div>`}</section>`}
function messageHtml(m){const u=m.is_ai?{username:'Gia sư AI'}:(m.author||{});const member=S.members.find(x=>x.user_id===m.user_id),isOwner=!!u.is_owner,role=member?.role;let content=esc(m.content).replace(/\n/g,'<br>').replace(/@everyone/g,'<b style="color:var(--accent)">@everyone</b>');for(const c of S.channels){const token='#'+esc(c.name);content=content.split(token).join(`<a href="#" data-action="jump-channel" data-id="${c.id}">${token}</a>`)}for(const p of S.topics){const token='#'+esc(p.title);content=content.split(token).join(`<a href="#" data-action="jump-post" data-id="${p.id}">${token}</a>`)}return `<article class="msg"><span class="avatar ${isOwner?'owner':''}">${isOwner?'✦':esc(u.username?.[0]?.toUpperCase()||'?')}</span><div class="msg-main"><div class="msg-meta"><b class="${isOwner?'owner-name':''}" style="${role?`color:${esc(role.color)}`:''}">${esc(u.username||'Thành viên')}</b>${role?`<span class="member-role" style="color:${esc(role.color)};border-color:${esc(role.color)}66">[ ${esc(role.name)} ]</span>`:''}${isOwner?'<span class="owner-tag">[ MATH LEARN OWNER ]</span><span class="tick">✓</span>':''}<time>${stamp(m.created_at)}</time>${m.pinned?'<span title="Đã ghim">📌</span>':''}${canChatManage()?`<button class="icon" data-action="pin-message" data-id="${m.id}" title="${m.pinned?'Bỏ ghim':'Ghim'}">📌</button>`:''}${(m.user_id===S.session?.user?.id||canChatManage())?`<button class="icon" data-action="delete-message" data-id="${m.id}" title="Xóa">×</button>`:''}</div><div class="msg-content ${m.typing?'typing':''}">${content}${member?.muted_until&&new Date(member.muted_until)>new Date()?'<span class="owner-tag" style="color:#ff7385">❗ Đang tắt tiếng</span>':''}${m.attachment_path?`<div><a href="#" data-action="file-download" data-bucket="class-files" data-path="${esc(m.attachment_path)}">📎 Tải tệp đính kèm</a></div>`:''}</div></div></article>`}
function renderMemberGroups(){const all=[...S.members].sort((a,b)=>Number(!!b.user?.is_owner)-Number(!!a.user?.is_owner));const owners=all.filter(m=>m.user?.is_owner),teachers=all.filter(m=>m.class_role==='teacher'&&!m.user?.is_owner),custom=all.filter(m=>m.class_role==='custom'&&m.role?.separate_display),students=all.filter(m=>m.class_role==='student'||(m.class_role==='custom'&&!m.role?.separate_display));if(owner()&&!owners.length)owners.push({user_id:'system-owner',user:{username:'Admin',is_owner:true},class_role:'owner'});const group=(title,list)=>list.length?`<section class="group"><div class="group-title">${title} — ${list.length}</div>${list.map(m=>`<div class="member"><span class="avatar ${m.user?.is_owner?'owner':''}">${m.user?.is_owner?'✦':esc(m.user?.username?.[0]?.toUpperCase()||'?')}</span><span class="member-name ${m.user?.is_owner?'owner-name':''}" title="${esc(m.user?.username||'')}" style="${m.role?`color:${esc(m.role.color)}`:''}">${esc(m.user?.username||'')}</span>${m.role?`<span class="member-role" style="color:${esc(m.role.color)}">${esc(m.role.name)}</span>`:''}${m.muted_until&&new Date(m.muted_until)>new Date()?'<span title="Đang tắt tiếng" style="color:#ff7385">❗</span>':''}<span class="member-status ${S.online.has(m.user_id)?'online':''}" title="${S.online.has(m.user_id)?'Đang trực tuyến':'Ngoại tuyến'}"></span>${m.user?.is_owner?'<span class="tick">✓</span>':''}${canManageMembers()&&m.user_id!==S.session?.user?.id&&m.class_role!=='teacher'&&!m.user?.is_owner?`<button class="icon actions" data-action="manage-member" data-id="${m.user_id}">⋯</button>`:''}</div>`).join('')}</section>`:'';return group('MATH LEARN OWNER',owners)+group('GIÁO VIÊN',teachers)+custom.map(m=>group(esc(m.role?.name||'VAI TRÒ'),[m])).join('')+group('HỌC SINH',students)}
function renderComposer(){const math=[['√ căn','\\sqrt{}'],['a/b phân số','\\frac{}{}'],['∫ tích phân','\\int_{}^{}'],['Σ tổng','\\sum_{}^{}'],['π pi','\\pi'],['≤ bé hơn hoặc bằng','\\le'],['≥ lớn hơn hoặc bằng','\\ge'],['Δ delta','\\Delta'],['x² bình phương','x^2'],['√x căn x','\\sqrt{x}']];return `<div class="composer-area"><div class="mathbar"><span>Chèn công thức:</span>${math.map(([label,value])=>`<button title="${label}" data-action="insert-math" data-value="${esc(value)}">${label}</button>`).join('')}<button class="right" data-action="whiteboard">✎ Bảng vẽ</button><button data-action="attach">📎</button><input class="hidden" id="chat-file" type="file" accept="image/*,.pdf,.doc,.docx,.ppt,.pptx"></div><div class="compose"><input id="draft" autocomplete="off" value="${esc(S.draft)}" placeholder="Nhắn trong #${esc(S.channel.name)} — hỗ trợ $LaTeX$"/><button class="send" data-action="send">➤</button></div><div id="suggestion" class="suggestion hidden"></div></div>`}
function renderForum(){return `<div class="forum-list" id="forum-list"><div style="display:flex;justify-content:flex-end;margin-bottom:10px">${canForum()?'<button class="primary" data-action="new-post">＋ Tạo bài tập</button>':''}</div>${S.posts.length?S.posts.map(p=>`<article id="post-${p.id}" class="forum-card"><div class="forum-head"><b>${esc(p.author?.username||'Giáo viên')}</b><time>${new Date(p.created_at).toLocaleString('vi-VN')}</time></div><h3>${esc(p.title)}</h3><p>${esc(p.body).replace(/\n/g,'<br>')}</p>${p.attachment_path?`<a href="#" data-action="file-download" data-bucket="class-files" data-path="${esc(p.attachment_path)}">📎 Tải tệp bài tập</a>`:''}${(S.replies[p.id]||[]).map(m=>`<div class="grade-row"><b>${esc(m.author?.username||'Giáo viên')}</b>: ${esc(m.content)}</div>`).join('')}${canForum()?`<div class="submission-tools"><input id="reply-${p.id}" placeholder="Phản hồi trong chủ đề"><button class="secondary" data-action="forum-reply" data-id="${p.id}">Gửi phản hồi</button></div>`:''}${S.profile?.role==='student'?`<div class="submission"><strong>Nộp bài của bạn</strong><div class="submission-tools"><input type="file" data-submission="${p.id}" accept="image/*,.pdf,.doc,.docx,.ppt,.pptx"><button class="secondary" data-action="submit-work" data-id="${p.id}">Gửi bài nộp</button></div></div>`:''}${canManage()?`<div class="submission"><strong>Bài nộp của học sinh</strong><div class="grade-row" id="grades-${p.id}"><button class="secondary" data-action="load-submissions" data-id="${p.id}">Xem bài nộp</button></div></div>`:''}</article>`).join(''):'<div class="empty">Chưa có bài tập nào trong lớp.</div>'}</div>`}
function gameInputOptions(){return(S.gameOptions||'Học sinh 1\nHọc sinh 2\nHọc sinh 3\nHọc sinh 4').split(/\n|,/).map(x=>x.trim()).filter(Boolean)}
function renderGames(){const mode=S.gameMode||'wheel',raw=S.gameOptions??'',opts=raw.split(/\n|,/).map(x=>x.trim()).filter(Boolean),palette=['#778cff','#b17ce8','#ffb86b','#4bd4a2','#ff718d','#56c5e9','#d4a6ff','#f0d85c'],slices=opts.map((_,i)=>`${palette[i%palette.length]} ${i*360/Math.max(opts.length,1)}deg ${(i+1)*360/Math.max(opts.length,1)}deg`).join(','),labels=opts.map((name,i)=>{const angle=(i+.5)*360/Math.max(opts.length,1),radius=Math.min(112,opts.length>8?84:100);return `<span class="wheel-label" title="${esc(name)}" style="transform:translate(-50%,-50%) rotate(${angle}deg) translateY(-${radius}px) rotate(${-angle}deg)">${esc(name)}</span>`}).join(''),sticks=opts.map((_,i)=>`<span class="draw-stick ${S.gameResult&&i===S.gameWinnerIndex?'selected':''}" style="--stick-left:${opts.length===1?50:8+i*84/(opts.length-1)}%;--stick-rotate:${(i%5-2)*4}deg;--stick-height:${105+(i*37)%65}px;--stick-hue:${(i*53+265)%360}"></span>`).join(''),confetti=Array.from({length:42},(_,i)=>`<i class="confetti" style="--confetti-x:${(i*37)%100}%;--confetti-hue:${(i*47+245)%360};--confetti-time:${2.1+(i%9)*.17}s;--confetti-delay:${(i%12)*.055}s;--confetti-drift:${(i%2?1:-1)*(15+(i*13)%90)}px"></i>`).join('');return `<div class="muted small">${esc(S.cls?.name||'LỚP HỌC')}</div><h2>🎲 Minigame của lớp</h2><p>Nhập một mục trên mỗi dòng. Mỗi lựa chọn có xác suất như nhau.</p><div class="game-stage glow-box"><label>Các lựa chọn</label><textarea id="game-options" rows="5" placeholder="Nhóm 1\nNhóm 2\nNhóm 3">${esc(raw)}</textarea><div class="modal-actions game-mode-picks" style="justify-content:center"><button class="secondary glow-box ${mode==='wheel'?'active':''}" data-action="game-mode" data-mode="wheel">🎡 Vòng quay</button><button class="secondary glow-box ${mode==='draw'?'active':''}" data-action="game-mode" data-mode="draw">🎟️ Bốc thăm</button></div>${mode==='wheel'?`<div class="game-wheel" id="game-wheel" style="background:conic-gradient(${slices||'#778cff 0deg 360deg'});transform:rotate(${S.wheelAngle}deg)">${labels}<span class="wheel-hub">∑</span></div>`:`<div class="draw-title">Hũ có ${opts.length} que thăm · một que cho mỗi lựa chọn</div><div class="draw-jar ${S.gameBusy?'shaking':''}" id="game-jar">${sticks}</div>`}<button class="primary" data-action="play-game" ${S.gameBusy||!opts.length?'disabled':''}>${S.gameBusy?(mode==='draw'?'Đang lắc hũ…':'Đang quay…'):'✨ Chọn ngẫu nhiên'}</button><p class="small">${S.cls?'Minigame dành cho lớp '+esc(S.cls.name)+'.':'Hãy vào lớp để dùng trò chơi cùng các bạn.'}</p>${S.gameResult?`<div class="game-win-overlay">${confetti}<section class="game-win-card"><div style="font-size:38px">🎉</div><h3>Chúc mừng!</h3><p>Kết quả được chọn ngẫu nhiên</p><div class="game-win-result">${esc(S.gameResult)}</div><div class="game-win-actions"><button class="secondary" data-action="game-again">↻ Quay lại</button><button class="danger" data-action="game-clear">⌫ Xóa lượt</button></div></section></div>`:''}</div>`}

function renderTour(){const texts=['Đây là danh sách lớp. Tạo lớp hoặc tham gia bằng mã mời.','Mỗi lớp có các kênh thông báo, chat, hỏi đáp, AI và bài tập.','Khung chat hỗ trợ công thức LaTeX, file và bảng vẽ.','Danh sách thành viên hiển thị theo vai trò.'];return `<div class="onboard glass"><b>Hướng dẫn nhanh · ${S.tour}/4</b><p>${texts[S.tour-1]}</p><button class="secondary" data-action="skip-tour">Bỏ qua</button> <button class="primary" data-action="next-tour">${S.tour===4?'Hoàn tất':'Tiếp theo'}</button></div>`}

function watchMentions(id){if(S.notifyRt)sb.removeChannel(S.notifyRt);S.notifyRt=sb.channel(`lm-notify-${id}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`class_id=eq.${id}`},p=>{if(p.new.user_id!==S.session?.user?.id&&((p.new.mentions||[]).includes(S.session?.user?.id)||/@everyone\b/i.test(p.new.content)))toast('🔔 Bạn được nhắc đến trong lớp.')}).subscribe()}
function watchPresence(id){if(S.presence)sb.removeChannel(S.presence);S.online=new Set([S.session?.user?.id].filter(Boolean));S.presence=sb.channel(`lm-presence-${id}`,{config:{presence:{key:S.session?.user?.id}}}).on('presence',{event:'sync'},()=>{const state=S.presence.presenceState();S.online=new Set(Object.keys(state));render()}).on('postgres_changes',{event:'*',schema:'public',table:'class_members',filter:`class_id=eq.${id}`},async()=>{const r=await sb.from('class_members').select('*,user:users(username,is_owner),role:roles(*)').eq('class_id',id);if(!r.error){S.members=r.data||[];render()}}).subscribe(status=>{if(status==='SUBSCRIBED')S.presence.track({user_id:S.session?.user?.id,username:S.profile?.username,online_at:new Date().toISOString()})})}
function watchForum(id){S.rt=sb.channel(`lm-forum-${id}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'forum_posts',filter:`class_id=eq.${id}`},p=>{if(S.channel?.kind==='forum'&&p.new.channel_id===S.channel.id)loadChannel().catch(err)}).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`class_id=eq.${id}`},async p=>{if(S.channel?.kind!=='forum'||!p.new.channel_id.startsWith('forum-'))return;const postId=p.new.channel_id.slice(6);const author=await sb.from('users').select('username').eq('id',p.new.user_id).maybeSingle();(S.replies[postId]??=[]).push({...p.new,author:author.data});render()}).subscribe()}
async function loadClass(id){S.cls=S.classes.find(x=>x.id===id)||null;if(!S.cls)return;watchMentions(id);watchPresence(id);const [ch,mem,rl,tp]=await Promise.all([sb.from('channels').select('*').eq('class_id',id).order('created_at'),sb.from('class_members').select('*,user:users(username,is_owner),role:roles(*)').eq('class_id',id),sb.from('roles').select('*').eq('class_id',id),sb.from('forum_posts').select('id,title,channel_id').eq('class_id',id)]);if(ch.error)throw ch.error;if(mem.error)throw mem.error;if(tp.error)throw tp.error;S.channels=ch.data||[];S.members=mem.data||[];S.roles=rl.data||[];S.topics=tp.data||[];S.channel=S.channels.find(x=>x.slug===S.channel?.slug)||S.channels.find(x=>x.slug==='chat-chung')||S.channels[0]||null;await loadChannel();}
async function loadChannel(){if(S.rt){sb.removeChannel(S.rt);S.rt=null}S.messages=[];S.posts=[];S.replies={};if(!S.cls||!S.channel){render();return}if(S.channel.kind==='forum'){const r=await sb.from('forum_posts').select('*,author:users!forum_posts_author_id_fkey(username)').eq('class_id',S.cls.id).eq('channel_id',S.channel.id).order('created_at',{ascending:false});if(r.error)throw r.error;S.posts=r.data||[];watchForum(S.cls.id);if(S.posts.length){const ids=S.posts.map(p=>'forum-'+p.id),rr=await sb.from('messages').select('*,author:users!messages_user_id_fkey(username)').eq('class_id',S.cls.id).in('channel_id',ids).order('created_at');if(rr.error)throw rr.error;for(const m of rr.data||[]){const id=m.channel_id.slice(6);(S.replies[id]??=[]).push(m)}}}else{const r=await sb.from('messages').select('*,author:users!messages_user_id_fkey(username,is_owner)').eq('class_id',S.cls.id).eq('channel_id',S.channel.slug).order('created_at').limit(150);if(r.error)throw r.error;S.messages=r.data||[];S.rt=sb.channel(`lm-${S.cls.id}-${S.channel.slug}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`class_id=eq.${S.cls.id}`},async p=>{if(p.new.channel_id!==S.channel?.slug||(p.new.is_ai&&p.new.user_id===S.session?.user?.id))return;const a=await sb.from('users').select('username,is_owner').eq('id',p.new.user_id).maybeSingle();S.messages.push({...p.new,author:a.data});if((p.new.mentions||[]).includes(S.session.user.id)||p.new.content.includes('@everyone'))toast('Bạn được nhắc đến trong kênh.');render()}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:`class_id=eq.${S.cls.id}`},p=>{const i=S.messages.findIndex(m=>m.id===p.new.id);if(i>=0)S.messages[i]={...S.messages[i],...p.new};render()}).on('postgres_changes',{event:'DELETE',schema:'public',table:'messages',filter:`class_id=eq.${S.cls.id}`},p=>{S.messages=S.messages.filter(m=>m.id!==p.old.id);render()}).subscribe()}render()}
async function upload(bucket,path,file){if(!file)return null;const {data,error}=await sb.storage.from(bucket).upload(path,file,{upsert:true,contentType:file.type});if(error)throw error;return data.path}
function safeSlug(x){return x.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9-]+/g,'-').replace(/^-|-$/g,'')||'kenh-moi'}
function mentionSuggestion(value){const box=$('#suggestion');if(!box)return;const match=value.match(/(?:^|\s)([@#][^\s]*)$/);if(!match){box.classList.add('hidden');return}const query=match[1].slice(1).toLowerCase();let options=[];if(match[1][0]==='@'){options=['everyone',...S.members.map(m=>m.user?.username).filter(Boolean)].filter(x=>x.toLowerCase().includes(query)).slice(0,7).map(x=>`@${x}`)}else{options=S.channels.map(c=>`#${c.name}`).filter(x=>x.toLowerCase().includes(query));options.push(...S.topics.map(p=>`#${p.title}`));options=options.slice(0,7)}if(!options.length){box.classList.add('hidden');return}box.innerHTML=options.map(x=>`<button data-action="pick-mention" data-value="${esc(x)}">${esc(x)}</button>`).join('');box.classList.remove('hidden')}
function setupCanvas(){const canvas=$('#board');if(!canvas)return;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#26345a';ctx.lineWidth=4;ctx.lineCap='round';let drawing=false;const point=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}};canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};canvas.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()};canvas.onpointerup=()=>drawing=false;S.canvas=canvas}

document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;try{
if(form.id==='auth-form'){const fd=new FormData(form),username=String(fd.get('username')).trim(),password=String(fd.get('password'));S.busy=true;render();try{if(S.role==='register'){if(password!==fd.get('confirm'))throw Error('Mật khẩu nhập lại không khớp.');const r=await sb.auth.signUp({email:`${username.toLowerCase()}@mathlearn.app`,password,options:{data:{username}}});if(r.error)throw r.error;if(!r.data.session){S.authNotice='Tài khoản đã tạo. Nếu chưa vào được, giáo viên cần tắt xác nhận email trong Supabase.';return}}else if(username.toLowerCase()==='admin'){const d=await edge('owner-session',{username,password});if(!d?.session)throw Error('Owner function chưa trả về phiên đăng nhập.');await sb.auth.setSession({access_token:d.session.access_token,refresh_token:d.session.refresh_token})}else{const r=await sb.auth.signInWithPassword({email:`${username.toLowerCase()}@mathlearn.app`,password});if(r.error)throw r.error}S.authNotice=''}finally{S.busy=false;render()}return}
if(form.id==='class-form'){const fd=new FormData(form);if(S.modalMode==='create'){const r=await sb.rpc('create_class_with_defaults',{p_name:fd.get('name'),p_avatar_url:null});if(r.error)throw r.error;const file=fd.get('avatar');if(file?.size){const avatar_url=await upload('class-files',`${r.data.id}/avatar/${crypto.randomUUID()}-${file.name}`,file);const up=await sb.from('classes').update({avatar_url}).eq('id',r.data.id);if(up.error)throw up.error}await reloadClasses();S.modal='';await loadClass(r.data.id)}else{const r=await sb.rpc('join_class_by_code',{p_code:String(fd.get('code')).trim().toUpperCase()});if(r.error)throw r.error;await reloadClasses();S.modal='';await loadClass(r.data.id)}return}
if(form.id==='settings-form'){const fd=new FormData(form);let avatar_url=S.cls.avatar_url;const file=fd.get('avatar');if(file?.size)avatar_url=await upload('class-files',`${S.cls.id}/avatar/${crypto.randomUUID()}-${file.name}`,file);const r=await sb.from('classes').update({name:fd.get('name'),avatar_url}).eq('id',S.cls.id);if(r.error)throw r.error;await sb.from('audit_logs').insert({class_id:S.cls.id,actor_id:S.session.user.id,action:'class.updated',details:{name:fd.get('name')}});await reloadClasses();S.cls=S.classes.find(x=>x.id===S.cls.id);S.modal='';render();toast('Đã cập nhật lớp.');return}
if(form.id==='role-form'){const fd=new FormData(form),payload={class_id:S.cls.id,name:fd.get('name'),color:fd.get('color'),separate_display:fd.has('separate_display'),can_manage_class:fd.has('can_manage_class'),can_manage_chat:fd.has('can_manage_chat'),can_manage_members:fd.has('can_manage_members'),can_manage_forum:fd.has('can_manage_forum')},r=S.editRole?await sb.from('roles').update(payload).eq('id',S.editRole):await sb.from('roles').insert(payload);if(r.error)throw r.error;await sb.from('audit_logs').insert({class_id:S.cls.id,actor_id:S.session.user.id,action:S.editRole?'role.updated':'role.created',details:{name:fd.get('name')}});S.editRole=null;await loadClass(S.cls.id);S.modal='settings';render();return}
if(form.id==='channel-form'){const fd=new FormData(form),name=String(fd.get('name')).trim(),r=await sb.from('channels').insert({class_id:S.cls.id,name,slug:safeSlug(name),kind:fd.get('kind'),created_by:S.session.user.id});if(r.error)throw r.error;await sb.from('audit_logs').insert({class_id:S.cls.id,actor_id:S.session.user.id,action:'channel.created',details:{name}});S.modal='';await loadClass(S.cls.id);return}
if(form.id==='post-form'){const fd=new FormData(form);let attachment_path=null;const file=fd.get('file');if(file?.size)attachment_path=await upload('class-files',`${S.cls.id}/posts/${crypto.randomUUID()}-${file.name}`,file);const r=await sb.from('forum_posts').insert({class_id:S.cls.id,channel_id:S.channel.id,author_id:S.session.user.id,title:fd.get('title'),body:fd.get('body'),attachment_path});if(r.error)throw r.error;await sb.from('audit_logs').insert({class_id:S.cls.id,actor_id:S.session.user.id,action:'forum.created',details:{title:fd.get('title')}});S.modal='';await loadChannel();return}
}catch(ex){err(ex)}});

document.addEventListener('input',e=>{if(e.target.id==='draft'){S.draft=e.target.value;mentionSuggestion(S.draft)}if(e.target.id==='game-options')S.gameOptions=e.target.value;if(e.target.matches('[data-submission]'))S.submissionFiles??=new Map(),S.submissionFiles.set(e.target.dataset.submission,e.target.files[0])});
document.addEventListener('keydown',e=>{if(e.target.id==='draft'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}if(e.key==='Escape'&&S.modal){S.modal='';render()}});
async function sendMessage(){const text=$('#draft')?.value.trim();if(!text||!S.channel)return;S.draft='';render();if(S.channel.kind==='ai'){try{const saved=await sb.from('messages').insert({class_id:S.cls.id,channel_id:S.channel.slug,user_id:S.session.user.id,content:text,mentions:extractMentions(text)});if(saved.error)throw saved.error;const thinking={id:crypto.randomUUID(),author:{username:'Gia sư AI'},content:'AI CHAT Thinking...',created_at:new Date().toISOString(),typing:true};S.messages.push(thinking);render();const started=Date.now();const d=await edge('ai-chat',{prompt:text,classId:S.cls.id,channelSlug:S.channel.slug});if(Date.now()-started<2100)await new Promise(r=>setTimeout(r,2100-(Date.now()-started)));thinking.content='';thinking.typing=false;for(const word of d.answer.split(/(\s+)/)){thinking.content+=word;render();await new Promise(r=>setTimeout(r,24))}S.messages=S.messages.filter(m=>m!==thinking);await loadChannel()}catch(e){err(e);S.messages.push({id:crypto.randomUUID(),author:{username:'Gia sư AI'},content:e.message,created_at:new Date().toISOString()});render()}return}let attachment_path=null;try{if(S.pendingFile){const f=S.pendingFile;attachment_path=await upload('class-files',`${S.cls.id}/chat/${S.session.user.id}/${crypto.randomUUID()}-${f.name}`,f);S.pendingFile=null}const r=await sb.from('messages').insert({class_id:S.cls.id,channel_id:S.channel.slug,user_id:S.session.user.id,content:text,attachment_path,mentions:extractMentions(text)});if(r.error)throw r.error}catch(e){err(e)}}
function extractMentions(text){if(/@everyone\b/i.test(text))return S.members.map(m=>m.user_id);return S.members.filter(m=>m.user?.username&&text.toLowerCase().includes('@'+m.user.username.toLowerCase())).map(m=>m.user_id)}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;try{
switch(a){case'auth-toggle':S.role=S.role==='register'?'':'register';S.authNotice='';render();break;case'close-menu':S.menu=false;render();break;case'menu':S.menu=!S.menu;render();break;case'home':S.menu=false;S.modal='home';render();break;case'games':S.menu=false;S.gameResult='';S.modal='games';render();break;case'about':S.menu=false;S.modal='about';render();break;case'game-mode':{S.gameMode=b.dataset.mode;S.gameResult='';S.gameWinnerIndex=-1;S.gameOptions=$('#game-options')?.value||S.gameOptions;render();break}
case'toggle-custom-select':{const id=b.dataset.selectId,menu=$(`[data-select-menu="${id}"]`),opening=menu?.classList.contains('hidden');$$('.custom-select-menu').forEach(x=>x.classList.add('hidden'));$$('.custom-select-trigger').forEach(x=>x.setAttribute('aria-expanded','false'));if(opening&&menu){menu.classList.remove('hidden');b.setAttribute('aria-expanded','true')}break}
case'choose-custom-select':{const select=$(`#${b.dataset.selectId}`);if(select){select.value=b.dataset.value;const wrap=b.closest('.select-wrap');wrap.querySelector('.custom-select-current').textContent=b.textContent;wrap.querySelectorAll('.custom-select-option').forEach(x=>x.setAttribute('aria-selected',String(x===b)));wrap.querySelector('.custom-select-menu').classList.add('hidden');wrap.querySelector('.custom-select-trigger').setAttribute('aria-expanded','false');select.dispatchEvent(new Event('change',{bubbles:true}))}break}
case'game-again':S.gameResult='';render();break;case'game-clear':S.gameResult='';S.gameOptions='';S.gameWinnerIndex=-1;render();break;
case'play-game':{const raw=$('#game-options')?.value||'',opts=raw.split(/\n|,/).map(x=>x.trim()).filter(Boolean);if(!opts.length)throw Error('Nhập ít nhất một lựa chọn.');S.gameOptions=raw;S.gameWinnerIndex=Math.floor(Math.random()*opts.length);S.gameResult='';S.gameBusy=true;render();if(S.gameMode==='wheel'){const wheel=$('#game-wheel'),mid=(S.gameWinnerIndex+.5)*360/opts.length,current=((S.wheelAngle%360)+360)%360,delta=(360-(mid+current)%360)%360;S.wheelAngle+=7*360+delta;if(wheel)wheel.style.transform=`rotate(${S.wheelAngle}deg)`;await new Promise(r=>setTimeout(r,4850))}else{await new Promise(r=>setTimeout(r,50));$('#game-jar')?.classList.add('shaking');await new Promise(r=>setTimeout(r,1650))}S.gameBusy=false;S.gameResult=opts[S.gameWinnerIndex];render();break}
case'logout':await sb.auth.signOut();S.session=null;S.profile=null;S.cls=null;render();break;
case'theme':case'toggle-theme':S.theme=S.theme==='dark'?'light':'dark';localStorage.setItem('lm-theme',S.theme);render();break;
case'class-dialog':S.modal='class';S.modalMode=S.profile?.role==='teacher'||owner()?'create':'join';render();break;case'create-class':S.modal='class';S.modalMode='create';render();break;case'join-class':S.modal='class';S.modalMode='join';render();break;
case'select-class':await loadClass(b.dataset.id);if(innerWidth<=767){S.mobilePane='channels';render()}break;case'select-channel':S.channel=S.channels.find(x=>x.id===b.dataset.id);if(innerWidth<=767)S.mobilePane='chat';await loadChannel();break;case'jump-channel':S.channel=S.channels.find(x=>x.id===b.dataset.id);await loadChannel();break;case'jump-post':{const post=S.topics.find(x=>x.id===b.dataset.id);if(post){S.channel=S.channels.find(x=>x.id===post.channel_id);await loadChannel();setTimeout(()=>document.getElementById(`post-${post.id}`)?.scrollIntoView({behavior:'smooth'}),50)}break}
case'reload-classes':await reloadClasses();render();break;case'class-settings':if(!canManage())throw Error('Bạn không có quyền quản lý lớp.');S.modal='settings';render();break;
case'copy-invite':await navigator.clipboard.writeText(S.cls.invite_code);toast('Đã sao chép mã mời.');break;
case'new-channel':if(!canManage())throw Error('Không có quyền tạo kênh.');S.modal='channel';render();break;case'new-post':if(!canForum())throw Error('Không có quyền đăng bài.');S.modal='post';render();break;
case'close-modal':S.modal='';render();break;case'modal-back':if(e.target===b){S.modal='';render()}break;
case'dismiss-role':localStorage.setItem(`lm-role-seen-${S.session?.user?.id}`,'1');S.modal='';render();break;
case'choose-role':{const r=await sb.from('users').update({role:b.dataset.role}).eq('id',S.session.user.id);if(r.error)throw r.error;await refreshProfile();localStorage.setItem(`lm-role-seen-${S.session.user.id}`,'1');S.modal='';render();if(!localStorage.getItem(`lm-tour-${S.session.user.id}`)){S.tour=1;render()}break}
case'next-tour':if(S.tour>=4){S.tour=0;localStorage.setItem(`lm-tour-${S.session.user.id}`,'1')}else S.tour++;render();break;case'skip-tour':S.tour=0;localStorage.setItem(`lm-tour-${S.session.user.id}`,'1');render();break;
case'send':await sendMessage();break;case'insert-math':{const input=$('#draft'),v=b.dataset.value;input.value+=` $${v}$ `;S.draft=input.value;input.focus();break}
case'attach':$('#chat-file').click();break;case'whiteboard':S.modal='whiteboard';render();setupCanvas();break;case'clear-board':setupCanvas();break;case'send-board':{const canvas=$('#board');const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));S.pendingFile=new File([blob],'whiteboard.png',{type:'image/png'});S.draft='Bảng vẽ hình học';S.modal='';render();await sendMessage();break}
case'mobile-rail':S.menu=!S.menu;render();break;case'mobile-classes':S.mobilePane='classes';S.menu=false;render();break;case'mobile-back':S.mobilePane=S.mobilePane==='chat'?'channels':S.mobilePane==='channels'?'classes':(S.cls?'chat':'classes');render();break;case'show-members':S.membersOpen=!S.membersOpen;render();break;
case'pick-mention':{const input=$('#draft'),value=input.value.replace(/(?:^|\s)([@#][^\s]*)$/,' $1');input.value=value.replace(/[@#][^\s]*$/,'')+b.dataset.value+' ';S.draft=input.value;$('#suggestion').classList.add('hidden');input.focus();break}
case'manage-member':S.targetMember=b.dataset.id;S.modal='member';render();break;
case'assign-role':{const roleId=$('#member-role').value||null,r=await sb.from('class_members').update({role_id:roleId,class_role:roleId?'custom':'student'}).eq('class_id',S.cls.id).eq('user_id',b.dataset.id);if(r.error)throw r.error;await sb.from('audit_logs').insert({class_id:S.cls.id,actor_id:S.session.user.id,action:'member.role_changed',details:{user_id:b.dataset.id,role_id:roleId}});S.modal='';await loadClass(S.cls.id);break}
case'mute-member':case'kick-member':case'ban-member':case'unmute-member':{const action={ 'mute-member':'mute','kick-member':'kick','ban-member':'ban','unmute-member':'unmute'}[a],mins=Number($('#mute-minutes')?.value||10);const r=await sb.rpc('manage_member_action',{p_class_id:S.cls.id,p_user_id:b.dataset.id,p_action:action,p_minutes:mins});if(r.error)throw r.error;S.modal='';await loadClass(S.cls.id);toast(action==='mute'?`Đã tắt chat trong ${mins} phút.`:'Đã cập nhật thành viên.');break}
case'edit-role':{const role=S.roles.find(x=>x.id===b.dataset.id);if(role){S.editRole=role.id;S.modal='settings';render();const form=$('#role-form');if(form){form.elements.name.value=role.name;form.elements.color.value=role.color||'#929fff';for(const key of ['separate_display','can_manage_class','can_manage_chat','can_manage_members','can_manage_forum'])form.elements[key].checked=!!role[key];form.querySelector('button').textContent='Lưu thay đổi'}}break}
case'delete-role':{if(!confirm('Xóa vai trò này? Học sinh đang được gán sẽ trở về vai trò Học sinh.'))break;const r=await sb.from('roles').delete().eq('id',b.dataset.id);if(r.error)throw r.error;await loadClass(S.cls.id);S.modal='settings';render();toast('Đã xóa role.');break}
case'delete-message':{const r=await sb.from('messages').delete().eq('id',b.dataset.id);if(r.error)throw r.error;break}
case'pin-message':{const msg=S.messages.find(m=>m.id===b.dataset.id);if(!msg)break;const r=await sb.from('messages').update({pinned:!msg.pinned}).eq('id',msg.id);if(r.error)throw r.error;break}
case'forum-reply':{const input=$(`#reply-${b.dataset.id}`),text=input?.value.trim();if(!text)throw Error('Nhập nội dung phản hồi.');const r=await sb.from('messages').insert({class_id:S.cls.id,channel_id:`forum-${b.dataset.id}`,user_id:S.session.user.id,content:text});if(r.error)throw r.error;await loadChannel();break}
case'load-audit':{const r=await sb.from('audit_logs').select('*,actor:users!audit_logs_actor_id_fkey(username)').eq('class_id',S.cls.id).order('created_at',{ascending:false}).limit(100);if(r.error)throw r.error;S.auditLogs=r.data||[];S.modal='audit';render();break}
case'file-download':{e.preventDefault();const r=await sb.storage.from(b.dataset.bucket).createSignedUrl(b.dataset.path,300);if(r.error)throw r.error;const path=b.dataset.path.toLowerCase(),url=r.data.signedUrl;S.previewName=path.split('/').pop().replace(/^[\w-]+-/,'' )||'Tài liệu';S.previewUrl=/\.(docx?|pptx?)$/i.test(path)?`https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`:url;S.modal='file-preview';render();break}
case'submit-work':{const file=S.submissionFiles?.get(b.dataset.id);if(!file)throw Error('Chọn tệp bài làm trước.');const path=`${S.cls.id}/${b.dataset.id}/${S.session.user.id}/${crypto.randomUUID()}-${file.name}`;await upload('submissions',path,file);const r=await sb.from('submissions').upsert({post_id:b.dataset.id,student_id:S.session.user.id,storage_path:path},{onConflict:'post_id,student_id'});if(r.error)throw r.error;toast('Đã nộp bài.');break}
case'load-submissions':await showSubmissions(b.dataset.id);break;
case'grade':{const form=b.closest('[data-grade]'),r=await sb.from('submissions').update({grade:Number(form.querySelector('[name=grade]').value),feedback:form.querySelector('[name=feedback]').value,graded_by:S.session.user.id,graded_at:new Date().toISOString()}).eq('id',form.dataset.grade);if(r.error)throw r.error;toast('Đã lưu điểm và nhận xét.');break}
case'delete-class':if(!confirm('Xóa lớp và toàn bộ dữ liệu của lớp?'))break;{const r=await sb.from('classes').delete().eq('id',S.cls.id);if(r.error)throw r.error;S.cls=null;S.modal='';await reloadClasses();render();break}
}}
catch(ex){err(ex)}});
document.addEventListener('change',e=>{if(e.target.id==='chat-file'){S.pendingFile=e.target.files[0];if(S.pendingFile){const d=$('#draft');d.value=`Đính kèm: ${S.pendingFile.name}`;S.draft=d.value}}if(e.target.matches('[data-submission]')){S.submissionFiles??=new Map();S.submissionFiles.set(e.target.dataset.submission,e.target.files[0])}});
async function showSubmissions(postId){const r=await sb.from('submissions').select('*,student:users!submissions_student_id_fkey(username)').eq('post_id',postId).order('submitted_at',{ascending:false});if(r.error)throw r.error;const slot=$(`#grades-${postId}`);slot.innerHTML=r.data?.length?r.data.map(x=>`<div class="grade-row" data-grade="${x.id}"><b>${esc(x.student?.username||'Học sinh')}</b> · ${new Date(x.submitted_at).toLocaleString('vi-VN')} ${x.storage_path?`<a href="#" data-action="file-download" data-bucket="submissions" data-path="${esc(x.storage_path)}">Mở bài</a>`:''}<div><input name="grade" type="number" min="0" max="10" step="0.25" value="${x.grade??''}" placeholder="Điểm /10"><textarea name="feedback" placeholder="Nhận xét">${esc(x.feedback||'')}</textarea><button class="secondary" data-action="grade">Lưu điểm</button></div></div>`).join(''):'<div class="empty">Chưa có bài nộp.</div>'}

sb.auth.getSession().then(async({data})=>{S.session=data.session;if(S.session){try{await refreshProfile();await reloadClasses();if(S.profile?.role==='pending')S.modal='role';if(S.classes.length)await loadClass(S.classes[0].id);else render();if(!localStorage.getItem(`lm-tour-${S.session.user.id}`)&&!S.modal){S.tour=1;render()}}catch(e){err(e);render()}}else render()});
sb.auth.onAuthStateChange(async(event,session)=>{if(event==='INITIAL_SESSION')return;S.session=session;if(session){try{await refreshProfile();await reloadClasses();if(!S.modal&&S.profile.role==='pending')S.modal='role';if(S.classes.length&&!S.cls)await loadClass(S.classes[0].id);else render()}catch(e){err(e)}}else{S.profile=null;S.classes=[];S.cls=null;render()}});
</script></body></html>
