or:var(--muted)}.members-head span{margin-left:auto;background:var(--soft);padding:2px 6px;border-radius:9px}.group{margin:0 0 15px}.group-title{font-size:9px;color:var(--muted);margin:0 4px 7px;letter-spacing:.5px}.member{display:flex;align-items:center;gap:7px;padding:4px;border-radius:9px;font-size:11px}.member:hover{background:var(--soft)}.member .avatar{width:27px;height:27px;border-radius:9px;font-size:10px}.member .actions{margin-left:auto}.home{display:grid;place-items:center;grid-column:span 2}.home-card{text-align:center;max-width:450px;padding:30px}.home-card .hero-icon{font-size:48px}.home-card h1{font:800 29px Manrope;letter-spacing:-1px}.home-card p{color:var(--muted);font-size:13px;line-height:1.7}.toolbar{display:flex;gap:7px;justify-content:center;margin-top:18px}.forum-list{padding:14px;overflow:auto;flex:1}.forum-card{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.forum-head{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--accent)}.forum-head time{margin-left:auto;color:var(--muted);font-size:9px}.forum-card h3{font-size:15px;margin:10px 0 5px}.forum-card p{font-size:12px;color:var(--muted);line-height:1.6}.submission{border-top:1px solid var(--line);padding-top:11px;margin-top:12px}.submission strong{font-size:11px}.submission-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}.submission-tools input{max-width:210px;padding:7px;font-size:10px}.submission-tools button{padding:7px 10px}.grade-row{border-top:1px solid var(--line);padding-top:9px;margin-top:9px;font-size:11px}.grade-row input{width:82px;padding:7px}.grade-row textarea{margin-top:6px;min-height:55px}.modal-back{position:fixed;inset:0;z-index:20;background:#050713b8;backdrop-filter:blur(7px);display:grid;place-items:center;padding:18px}.modal{width:min(560px,100%);max-height:min(85vh,800px);overflow:auto;border-radius:19px;padding:22px;position:relative}.modal h2{font:700 20px Manrope;margin:3px 0 8px}.modal p{font-size:12px;color:var(--muted);line-height:1.6}.close{position:absolute;right:11px;top:11px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.role-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.role-card{padding:18px 12px;border:1px solid var(--line);background:var(--soft);border-radius:13px;text-align:center}.role-card:hover{border-color:var(--accent)}.role-card b,.role-card small{display:block;margin-top:7px}.role-card small{font-size:10px;color:var(--muted)}.toast{position:fixed;z-index:40;right:18px;bottom:18px;background:#242b49;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:12px 15px;max-width:390px;font-size:12px}.mention-menu{position:absolute;z-index:12;bottom:85px;left:20px;max-height:180px;overflow:auto;background:#222944;border:1px solid var(--line);border-radius:11px;padding:5px;min-width:180px}.mention-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px;border-radius:7px;font-size:11px}.mention-menu button:hover{background:var(--soft)}.canvas{border:1px solid var(--line);background:#f8f9ff;border-radius:10px;touch-action:none;width:100%;height:290px}.onboard{position:fixed;z-index:15;right:240px;top:80px;width:min(280px,calc(100vw - 30px));padding:16px;border-radius:14px}.onboard p{font-size:12px;color:var(--muted);line-height:1.5}.suggestion{position:absolute;bottom:82px;left:22px;z-index:10;background:#242b49;border:1px solid var(--line);border-radius:10px;max-height:170px;overflow:auto}.suggestion button{display:block;border:0;background:transparent;color:var(--text);padding:8px 12px;width:100%;text-align:left;font-size:11px}.suggestion button:hover{background:var(--soft)}.empty{color:var(--muted);font-size:12px;text-align:center;padding:25px}

<body><div id="root"></div><div id="toast" class="toast hidden"></div><script src="./config.js"></script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const cfg = window.MATH_LEARN_CONFIG || {};
if(!cfg.url||!cfg.publishableKey){document.querySelector('#root').innerHTML='<main class="auth-page"><section class="glass auth-card"><div class="logo">∑</div><h1>Math <span>Learn</span></h1><p>Chưa cấu hình Supabase. Mở site/config.js và thêm Project URL cùng Publishable key.</p></section></main>';throw new Error('Missing Supabase settings');}
const sb = createClient(cfg.url, cfg.publishableKey);
const $ = (q, el=document) => el.querySelector(q), $$=(q,el=document)=>[...el.querySelectorAll(q)];
const S={session:null,profile:null,classes:[],cls:null,channels:[],channel:null,messages:[],members:[],posts:[],topics:[],replies:{},theme:localStorage.getItem('lm-theme')||'dark',modal:'',toastTimer:null,rt:null,notifyRt:null,draft:'',upload:null,forumFile:null,role:'',tour:0,canvas:null};
const names={announcement:'thông-báo',chat:'chat-chung',qa:'hỏi-đáp',ai:'ai-chat',forum:'bài-tập'};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stamp=x=>new Date(x).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
const owner=()=>Boolean(S.profile?.is_owner);
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(S.toastTimer);S.toastTimer=setTimeout(()=>el.classList.add('hidden'),4000)}
function err(e){console.error(e);toast(e.message||'Có lỗi xảy ra.')}
async function edge(name,body){const {data,error}=await sb.functions.invoke(name,{body});if(error){let message=error.message||`Không gọi được chức năng ${name}.`;try{const detail=await error.context?.json();if(detail?.error)message=detail.error}catch{}throw Error(message)}return data}
async function refreshProfile(){const {data,error}=await sb.from('users').select('*').eq('id',S.session.user.id).maybeSingle();if(error)throw error;S.profile=data;}
async function reloadClasses(){if(owner()){const r=await sb.from('classes').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;S.classes=r.data||[]}else{const r=await sb.from('class_members').select('class:classes(*)').order('created_at');if(r.error)throw r.error;S.classes=(r.data||[]).map(x=>x.class).filter(Boolean)}}
function canManage(){return owner()||S.members.some(m=>m.user_id===S.session?.user?.id&&(m.class_role==='teacher'||m.role?.can_manage_class))||S.cls?.created_by===S.session?.user?.id}
function canManageMembers(){return canManage()||S.members.some(m=>m.user_id===S.session?.user?.id&&m.role?.can_manage_members)}
function canChatManage(){return canManage()||S.members.some(m=>m.user_id===S.session?.user?.id&&m.role?.can_manage_chat)}
function canForum(){return canManage()||S.members.some(m=>m.user_id===S.session?.user?.id&&m.role?.can_manage_forum)}
function me(){return S.members.find(m=>m.user_id===S.session?.user?.id)}
function render(){document.documentElement.dataset.theme=S.theme;document.body.classList.toggle('light',S.theme==='light');if(!S.session){renderAuth();return}renderApp()}
function renderAuth(){const register=S.role==='register';$('#root').innerHTML=`<main class="auth-page"><section class="glass auth-card"><div class="logo">∑</div><div class="muted small">KHÔNG GIAN HỌC TOÁN TRỰC TUYẾN</div><h1>Math <span>Learn</span></h1><p>Cùng học, cùng hỏi, cùng tiến bộ.</p><form id="auth-form"><label>Tên đăng nhập</label><input name="username" autocomplete="username" required placeholder="Ví dụ: minhthu"><label>Mật khẩu</label><input name="password" type="password" autocomplete="${register?'new-password':'current-password'}" required placeholder="Nhập mật khẩu" minlength="6">${register?'<label>Nhập lại mật khẩu</label><input name="confirm" type="password" required minlength="6" placeholder="Nhập lại mật khẩu">':''}<button class="primary">${register?'Tạo tài khoản':'Đăng nhập'}</button></form><button class="text-btn" data-action="auth-toggle">${register?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Đăng ký'}</button><div class="notice">${esc(S.authNotice||'')}</div><div class="muted small">Tài khoản được xác thực và lưu bởi Supabase.</div></section></main>`}
function renderApp(){const c=S.cls;const clist=S.classes.map(x=>`<button class="class-row ${x.id===c?.id?'active':''}" data-action="select-class" data-id="${x.id}"><span class="avatar">${esc(x.name?.[0]?.toUpperCase()||'L')}</span><span><b>${esc(x.name)}</b><small>${esc(x.invite_code)}</small></span></button>`).join('');
const channels=S.channels.map(x=>`<button class="channel ${S.channel?.slug===x.slug?'active':''}" data-action="select-channel" data-id="${x.id}"><span>${x.kind==='announcement'?'◉':x.kind==='forum'?'▤':'#'}</span>${esc(x.name)}${x.kind==='ai'?'<small>AI</small>':''}</button>`).join('');
$('#root').innerHTML=`<div class="app"><header class="topbar glass"><button class="icon" data-action="mobile-rail">☰</button><div class="brand"><span class="logo">∑</span>Math Learn</div><div class="grow"></div><div class="top-right"><span class="online"></span><span>Không gian học tập</span><button class="icon" data-action="theme" title="Đổi giao diện">${S.theme==='dark'?'☼':'☾'}</button><button class="user-pill" data-action="logout"><span class="avatar">${esc(S.profile?.username?.[0]?.toUpperCase()||'B')}</span>${esc(S.profile?.username||'Bạn')} ⎋</button></div></header>
<div class="main-grid"><aside class="rail glass" id="rail"><div class="section-title">LỚP HỌC CỦA BẠN <button class="icon" data-action="class-dialog" title="Tạo hoặc tham gia lớp">＋</button></div>${owner()?'<div class="owner-tag">✦ QUYỀN OWNER</div>':''}<div class="class-list">${clist||'<div class="empty">Chưa có lớp. Tạo lớp hoặc tham gia bằng mã mời.</div>'}</div><div class="rail-bottom"><button class="user-pill" data-action="logout" style="width:100%"><span class="avatar">${esc(S.profile?.username?.[0]?.toUpperCase()||'B')}</span><span style="flex:1;text-align:left">${esc(S.profile?.username||'')}</span>Đăng xuất</button></div></aside>
${c?`<aside class="channels glass" id="channels"><div class="class-head"><span class="avatar">${esc(c.name?.[0]?.toUpperCase()||'L')}</span><span class="info"><b>${esc(c.name)}</b><small>Mã mời ${esc(c.invite_code)}</small></span>${canManage()?'<button class="icon" data-action="class-settings">⚙</button>':''}</div><div class="channel-list">${channels}${canManage()?'<button class="channel" data-action="new-channel">＋ Thêm kênh</button>':''}</div><div class="channel-bottom">◈ Không gian lớp học</div></aside><main class="chat glass"><header class="chat-head"><div><h2>${S.channel?`# ${esc(S.channel.name)}`:'Chọn kênh'}</h2><p>${S.channel?.kind==='ai'?'Trợ lý AI Toán học':S.channel?.kind==='forum'?'Bài tập, tài liệu và bài nộp':`Trao đổi cùng lớp ${esc(c.name)}`}</p></div><button class="icon" data-action="show-members">♙ ${S.members.length}</button></header>${S.channel?.kind==='forum'?renderForum():renderMessages()}${S.channel&&S.channel.kind!=='forum'?renderComposer():''}</main><aside class="members glass"><div class="members-head">♙ THÀNH VIÊN <span>${S.members.length+(owner()&&!S.members.some(m=>m.user?.is_owner)?1:0)}</span></div>${renderMemberGroups()}</aside>`:`<main class="home glass"><div class="home-card"><div class="hero-icon">📐</div><div class="muted small">HỌC TOÁN CÙNG NHAU</div><h1>Mỗi câu hỏi là một bước tiến.</h1><p>Tạo lớp học hoặc tham gia bằng mã mời để bắt đầu trao đổi, chia sẻ bài tập và học cùng nhau.</p><div class="toolbar">${S.profile?.role==='teacher'||owner()?'<button class="primary" data-action="create-class">＋ Tạo lớp học</button>':''}${S.profile?.role==='student'?'<button class="primary" data-action="join-class">Tham gia lớp</button>':''}${owner()?'<button class="secondary" data-action="reload-classes">Tải lại tất cả lớp</button>':''}</div></div></main>`}</div></div>${S.modal?renderModal():''}${S.tour?renderTour():''}`;
if(S.channel?.kind!=='forum'){$('#messages')?.scrollTo(0,999999);$$('.msg-content').forEach(el=>{if(window.renderMathInElement)renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})})}}
function renderMessages(){return `<section class="messages" id="messages">${S.messages.length?S.messages.map(messageHtml).join(''):`<div class="welcome"><div class="hero-icon">✦</div><h3>Bắt đầu cuộc trò chuyện</h3><p>Chào mừng bạn đến với <b>#${esc(S.channel?.name||'')}</b>.<br>Hãy hỏi một câu Toán học nhé.</p></div>`}</section>`}
function messageHtml(m){const u=m.is_ai?{username:'Gia sư AI'}:(m.author||{});const isOwner=!!u.is_owner;let content=esc(m.content).replace(/\n/g,'<br>').replace(/@everyone/g,'<b style="color:var(--accent)">@everyone</b>');for(const c of S.channels){const token='#'+esc(c.name);content=content.split(token).join(`<a href="#" data-action="jump-channel" data-id="${c.id}">${token}</a>`)}for(const p of S.topics){const token='#'+esc(p.title);content=content.split(token).join(`<a href="#" data-action="jump-post" data-id="${p.id}">${token}</a>`)}return `<article class="msg"><span class="avatar ${isOwner?'owner':''}">${isOwner?'✦':esc(u.username?.[0]?.toUpperCase()||'?')}</span><div class="msg-main"><div class="msg-meta"><b class="${isOwner?'owner-name':''}">${esc(u.username||'Thành viên')}</b>${isOwner?'<span class="owner-tag">[ MATH LEARN OWNER ]</span><span class="tick">✓</span>':''}<time>${stamp(m.created_at)}</time>${m.pinned?'<span title="Đã ghim">📌</span>':''}${canChatManage()?`<button class="icon" data-action="pin-message" data-id="${m.id}" title="${m.pinned?'Bỏ ghim':'Ghim'}">📌</button>`:''}${(m.user_id===S.session?.user?.id||canChatManage())?`<button class="icon" data-action="delete-message" data-id="${m.id}" title="Xóa">×</button>`:''}</div><div class="msg-content ${m.typing?'typing':''}">${content}${m.attachment_path?`<div><a href="#" data-action="file-download" data-bucket="class-files" data-path="${esc(m.attachment_path)}">📎 Tải tệp đính kèm</a></div>`:''}</div></div></article>`}
function renderMemberGroups(){const all=[...S.members].sort((a,b)=>Number(!!b.user?.is_owner)-Number(!!a.user?.is_owner));const owners=all.filter(m=>m.user?.is_owner),teachers=all.filter(m=>m.class_role==='teacher'&&!m.user?.is_owner),custom=all.filter(m=>m.class_role==='custom'&&m.role?.separate_display),students=all.filter(m=>m.class_role==='student'||(m.class_role==='custom'&&!m.role?.separate_display));if(owner()&&!owners.length)owners.push({user_id:'system-owner',user:{username:'Admin',is_owner:true},class_role:'owner'});const group=(title,list)=>list.length?`<section class="group"><div class="group-title">${title} — ${list.length}</div>${list.map(m=>`<div class="member"><span class="avatar ${m.user?.is_owner?'owner':''}">${m.user?.is_owner?'✦':esc(m.user?.username?.[0]?.toUpperCase()||'?')}</span><span class="${m.user?.is_owner?'owner-name':''}">${esc(m.user?.username||'')}</span>${m.user?.is_owner?'<span class="tick">✓</span>':''}${canManageMembers()&&m.user_id!==S.session?.user?.id&&m.class_role!=='teacher'&&!m.user?.is_owner?`<button class="icon actions" data-action="manage-member" data-id="${m.user_id}">⋯</button>`:''}</div>`).join('')}</section>`:'';return group('MATH LEARN OWNER',owners)+group('GIÁO VIÊN',teachers)+custom.map(m=>group(esc(m.role?.name||'VAI TRÒ'),[m])).join('')+group('HỌC SINH',students)}
function renderComposer(){return `<div class="composer-area"><div class="mathbar"><span>Chèn nhanh:</span>${['\\sqrt{}','\\frac{}{}','\\int','\\sum','\\pi','\\le','\\ge','\\Delta'].map(x=>`<button data-action="insert-math" data-value="${esc(x)}">${esc(x)}</button>`).join('')}<button class="right" data-action="whiteboard">✎ Bảng vẽ</button><button data-action="attach">📎</button><input class="hidden" id="chat-file" type="file" accept="image/*,.pdf,.doc,.docx"></div><div class="compose"><button class="icon" data-action="toggle-theme" title="Công thức">＠</button><input id="draft" autocomplete="off" value="${esc(S.draft)}" placeholder="Nhắn trong #${esc(S.channel.name)} — $LaTeX$ hỗ trợ"/><button class="send" data-action="send">➤</button></div><div id="suggestion" class="suggestion hidden"></div></div>`}
function renderForum(){return `<div class="forum-list" id="forum-list"><div style="display:flex;justify-content:flex-end;margin-bottom:10px">${canForum()?'<button class="primary" data-action="new-post">＋ Tạo bài tập</button>':''}</div>${S.posts.length?S.posts.map(p=>`<article id="post-${p.id}" class="forum-card"><div class="forum-head"><b>${esc(p.author?.username||'Giáo viên')}</b><time>${new Date(p.created_at).toLocaleString('vi-VN')}</time></div><h3>${esc(p.title)}</h3><p>${esc(p.body).replace(/\n/g,'<br>')}</p>${p.attachment_path?`<a href="#" data-action="file-download" data-bucket="class-files" data-path="${esc(p.attachment_path)}">📎 Tải tệp bài tập</a>`:''}${(S.replies[p.id]||[]).map(m=>`<div class="grade-row"><b>${esc(m.author?.username||'Giáo viên')}</b>: ${esc(m.content)}</div>`).join('')}${canForum()?`<div class="submission-tools"><input id="reply-${p.id}" placeholder="Phản hồi trong chủ đề"><button class="secondary" data-action="forum-reply" data-id="${p.id}">Gửi phản hồi</button></div>`:''}${S.profile?.role==='student'?`<div class="submission"><strong>Nộp bài của bạn</strong><div class="submission-tools"><input type="file" data-submission="${p.id}" accept="image/*,.pdf,.doc,.docx"><button class="secondary" data-action="submit-work" data-id="${p.id}">Gửi bài nộp</button></div></div>`:''}${canManage()?`<div class="submission"><strong>Bài nộp của học sinh</strong><div class="grade-row" id="grades-${p.id}"><button class="secondary" data-action="load-submissions" data-id="${p.id}">Xem bài nộp</button></div></div>`:''}</article>`).join(''):'<div class="empty">Chưa có bài tập nào trong lớp.</div>'}</div>`}
function renderModal(){let body='';switch(S.modal){case 'role':body=`<div class="muted small">CHÀO MỪNG ĐẾN VỚI MATH LEARN</div><h2>Bạn là?</h2><p>Chọn vai trò để mở các chức năng phù hợp.</p><div class="role-cards"><button class="role-card" data-action="choose-role" data-role="student"><span style="font-size:28px">🎓</span><b>Học sinh</b><small>Tham gia lớp, trao đổi và nộp bài</small></button><button class="role-card" data-action="choose-role" data-role="teacher"><span style="font-size:28px">📐</span><b>Giáo viên</b><small>Tạo lớp và quản lý học tập</small></button></div>`;break;
case 'class':body=`<h2>${S.modalMode==='create'?'Tạo lớp học':'Tham gia lớp học'}</h2><p>${S.modalMode==='create'?'Đặt tên cho lớp mới.':'Nhập mã mời do giáo viên cung cấp.'}</p><form id="class-form">${S.modalMode==='create'?'<label>Tên lớp</label><input name="name" required placeholder="Ví dụ: Toán 9A"><label>Ảnh đại diện (tùy chọn)</label><input name="avatar" type="file" accept="image/*">':'<label>Mã mời</label><input name="code" required placeholder="LEARN-8492-A7X9">'}<div class="modal-actions"><button type="button" class="secondary" data-action="close-modal">Hủy</button><button class="primary">${S.modalMode==='create'?'Tạo lớp':'Tham gia'}</button></div></form>`;break;
case 'settings':body=`<h2>Cài đặt lớp</h2><form id="settings-form"><label>Tên lớp</label><input name="name" required value="${esc(S.cls.name)}"><label>Mã mời</label><div class="small">${esc(S.cls.invite_code)} <button type="button" class="secondary" data-action="copy-invite">Sao chép</button></div><label>Ảnh lớp</label><input name="avatar" type="file" accept="image/*"><div class="modal-actions"><button type="button" class="secondary" data-action="close-modal">Đóng</button><button class="primary">Lưu thay đổi</button></div></form><hr><h3>Roles</h3><div id="role-list">${S.roles?.map(r=>`<div class="member"><span style="color:${esc(r.color)}">●</span>${esc(r.name)} <small>${r.can_manage_class?'Quản lý lớp':''}${r.can_manage_chat?' · Quản lý chat':''}${r.can_manage_members?' · Quản lý thành viên':''}</small></div>`).join('')||''}</div><form id="role-form"><label>Tạo role mới</label><input name="name" required placeholder="Tên role"><input name="color" type="color" value="#929fff" style="height:40px"><label><input type="checkbox" name="separate_display"> Hiển thị nhóm riêng</label><label><input type="checkbox" name="can_manage_class"> Quản lý lớp</label><label><input type="checkbox" name="can_manage_chat"> Quản lý chat</label><label><input type="checkbox" name="can_manage_members"> Quản lý thành viên</label><label><input type="checkbox" name="can_manage_forum"> Quản lý bài tập</label><button class="secondary">Tạo role</button></form><div class="modal-actions"><button class="secondary" data-action="load-audit">Xem nhật ký</button><button class="danger" data-action="delete-class">Xóa lớp</button></div>`;break;
case 'audit':body=`<h2>Nhật ký lớp học</h2><div class="forum-list">${(S.auditLogs||[]).map(x=>`<div class="grade-row"><b>${esc(x.actor?.username||'Hệ thống')} · ${esc(x.action)}</b><time> · ${new Date(x.created_at).toLocaleString('vi-VN')}</time><div>${esc(JSON.stringify(x.details||{}))}</div></div>`).join('')||'<div class="empty">Chưa có nhật ký.</div>'}</div>`;break;
case 'channel':body=`<h2>Tạo kênh mới</h2><form id="channel-form"><label>Tên kênh</label><input name="name" required placeholder="ví dụ: ôn-tập"><label>Loại kênh</label><select name="kind"><option value="chat">Chat chung</option><option value="announcement">Thông báo</option><option value="qa">Hỏi đáp</option><option value="forum">Bài tập / Diễn đàn</option></select><div class="modal-actions"><button type="button" class="secondary" data-action="close-modal">Hủy</button><button class="primary">Tạo kênh</button></div></form>`;break;
case 'post':body=`<h2>Tạo chủ đề bài tập</h2><form id="post-form"><label>Tiêu đề</label><input name="title" required><label>Nội dung / hướng dẫn</label><textarea name="body" rows="5" required></textarea><label>Tệp đính kèm</label><input name="file" type="file" accept="image/*,.pdf,.doc,.docx"><div class="modal-actions"><button type="button" class="secondary" data-action="close-modal">Hủy</button><button class="primary">Đăng bài</button></div></form>`;break;
case 'member':body=`<h2>Quản lý thành viên</h2><p>Không thể tác động giáo viên tạo lớp hoặc Owner.</p><label>Vai trò tùy chỉnh</label><select id="member-role"><option value="">Học sinh</option>${(S.roles||[]).map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><div class="modal-actions"><button class="secondary" data-action="assign-role" data-id="${esc(S.targetMember)}">Gán role</button><button class="secondary" data-action="mute-member" data-id="${esc(S.targetMember)}">Mute 10 phút</button><button class="danger" data-action="kick-member" data-id="${esc(S.targetMember)}">Kick</button><button class="danger" data-action="ban-member" data-id="${esc(S.targetMember)}">Ban</button></div>`;break;
case 'whiteboard':body=`<h2>Bảng vẽ hình học</h2><p>Vẽ nhanh rồi gửi ảnh vào kênh hiện tại.</p><canvas class="canvas" id="board" width="1000" height="580"></canvas><div class="modal-actions"><button class="secondary" data-action="clear-board">Xóa bảng</button><button class="secondary" data-action="close-modal">Hủy</button><button class="primary" data-action="send-board">Gửi vào chat</button></div>`;break;
default:body=`<h2>${esc(S.modalTitle||'Thông tin')}</h2><p>${esc(S.modalText||'')}</p>`}
return `<div class="modal-back" data-action="modal-back"><section class="modal glass"><button class="icon close" data-action="close-modal">×</button>${body}</section></div>`}
function renderTour(){const texts=['Đây là danh sách lớp. Tạo lớp hoặc tham gia bằng mã mời.','Mỗi lớp có các kênh thông báo, chat, hỏi đáp, AI và bài tập.','Khung chat hỗ trợ công thức LaTeX, file và bảng vẽ.','Danh sách thành viên hiển thị theo vai trò.'];return `<div class="onboard glass"><b>Hướng dẫn nhanh · ${S.tour}/4</b><p>${texts[S.tour-1]}</p><button class="secondary" data-action="skip-tour">Bỏ qua</button> <button class="primary" data-action="next-tour">${S.tour===4?'Hoàn tất':'Tiếp theo'}</button></div>`}

function watchMentions(id){if(S.notifyRt)sb.removeChannel(S.notifyRt);S.notifyRt=sb.channel(`lm-notify-${id}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`class_id=eq.${id}`},p=>{if(p.new.user_id!==S.session?.user?.id&&((p.new.mentions||[]).includes(S.session?.user?.id)||/@everyone\b/i.test(p.new.content)))toast('🔔 Bạn được nhắc đến trong lớp.')}).subscribe()}
function watchForum(id){S.rt=sb.channel(`lm-forum-${id}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'forum_posts',filter:`class_id=eq.${id}`},p=>{if(S.channel?.kind==='forum'&&p.new.channel_id===S.channel.id)loadChannel().catch(err)}).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`class_id=eq.${id}`},async p=>{if(S.channel?.kind!=='forum'||!p.new.channel_id.startsWith('forum-'))return;const postId=p.new.channel_id.slice(6);const author=await sb.from('users').select('username').eq('id',p.new.user_id).maybeSingle();(S.replies[postId]??=[]).push({...p.new,author:author.data});render()}).subscribe()}
async function loadClass(id){S.cls=S.classes.find(x=>x.id===id)||null;if(!S.cls)return;watchMentions(id);const [ch,mem,rl,tp]=await Promise.all([sb.from('channels').select('*').eq('class_id',id).order('created_at'),sb.from('class_members').select('*,user:users(username,is_owner),role:roles(*)').eq('class_id',id),sb.from('roles').select('*').eq('class_id',id),sb.from('forum_posts').select('id,title,channel_id').eq('class_id',id)]);if(ch.error)throw ch.error;if(mem.error)throw mem.error;if(tp.error)throw tp.error;S.channels=ch.data||[];S.members=mem.data||[];S.roles=rl.data||[];S.topics=tp.data||[];S.channel=S.channels.find(x=>x.slug===S.channel?.slug)||S.channels.find(x=>x.slug==='chat-chung')||S.channels[0]||null;await loadChannel();}
async function loadChannel(){if(S.rt){sb.removeChannel(S.rt);S.rt=null}S.messages=[];S.posts=[];S.replies={};if(!S.cls||!S.channel){render();return}if(S.channel.kind==='forum'){const r=await sb.from('forum_posts').select('*,author:users!forum_posts_author_id_fkey(username)').eq('class_id',S.cls.id).eq('channel_id',S.channel.id).order('created_at',{ascending:false});if(r.error)throw r.error;S.posts=r.data||[];watchForum(S.cls.id);if(S.posts.length){const ids=S.posts.map(p=>'forum-'+p.id),rr=await sb.from('messages').select('*,author:users!messages_user_id_fkey(username)').eq('class_id',S.cls.id).in('channel_id',ids).order('created_at');if(rr.error)throw rr.error;for(const m of rr.data||[]){const id=m.channel_id.slice(6);(S.replies[id]??=[]).push(m)}}}else{const r=await sb.from('messages').select('*,author:users!messages_user_id_fkey(username,is_owner)').eq('class_id',S.cls.id).eq('channel_id',S.channel.slug).order('created_at').limit(150);if(r.error)throw r.error;S.messages=r.data||[];S.rt=sb.channel(`lm-${S.cls.id}-${S.channel.slug}`).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`class_id=eq.${S.cls.id}`},async p=>{if(p.new.channel_id!==S.channel?.slug||(p.new.is_ai&&p.new.user_id===S.session?.user?.id))return;const a=await sb.from('users').select('username,is_owner').eq('id',p.new.user_id).maybeSingle();S.messages.push({...p.new,author:a.data});if((p.new.mentions||[]).includes(S.session.user.id)||p.new.content.includes('@everyone'))toast('Bạn được nhắc đến trong kênh.');render()}).on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:`class_id=eq.${S.cls.id}`},p=>{const i=S.messages.findIndex(m=>m.id===p.new.id);if(i>=0)S.messages[i]={...S.messages[i],...p.new};render()}).on('postgres_changes',{event:'DELETE',schema:'public',table:'messages',filter:`class_id=eq.${S.cls.id}`},p=>{S.messages=S.messages.filter(m=>m.id!==p.old.id);render()}).subscribe()}render()}
async function upload(bucket,path,file){if(!file)return null;const {data,error}=await sb.storage.from(bucket).upload(path,file,{upsert:true,contentType:file.type});if(error)throw error;return data.path}
function safeSlug(x){return x.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9-]+/g,'-').replace(/^-|-$/g,'')||'kenh-moi'}
function mentionSuggestion(value){const box=$('#suggestion');if(!box)return;const match=value.match(/(?:^|\s)([@#][^\s]*)$/);if(!match){box.classList.add('hidden');return}const query=match[1].slice(1).toLowerCase();let options=[];if(match[1][0]==='@'){options=['everyone',...S.members.map(m=>m.user?.username).filter(Boolean)].filter(x=>x.toLowerCase().includes(query)).slice(0,7).map(x=>`@${x}`)}else{options=S.channels.map(c=>`#${c.name}`).filter(x=>x.toLowerCase().includes(query));options.push(...S.topics.map(p=>`#${p.title}`));options=options.slice(0,7)}if(!options.length){box.classList.add('hidden');return}box.innerHTML=options.map(x=>`<button data-action="pick-mention" data-value="${esc(x)}">${esc(x)}</button>`).join('');box.classList.remove('hidden')}
function setupCanvas(){const canvas=$('#board');if(!canvas)return;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#26345a';ctx.lineWidth=4;ctx.lineCap='round';let drawing=false;const point=e=>{const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}};canvas.onpointerdown=e=>{drawing=true;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};canvas.onpointermove=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()};canvas.onpointerup=()=>drawing=false;S.canvas=canvas}

document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;try{
if(form.id==='auth-form'){const fd=new FormData(form),username=String(fd.get('username')).trim(),password=String(fd.get('password'));if(S.role==='register'){if(password!==fd.get('confirm'))throw Error('Mật khẩu nhập lại không khớp.');const r=await sb.auth.signUp({email:`${username.toLowerCase()}@mathlearn.app`,password,options:{data:{username}}});if(r.error)throw r.error;if(!r.data.session){S.authNotice='Đã tạo tài khoản. Kiểm tra Auth confirmation hoặc tắt Confirm email khi thử nghiệm.';render();return}}else if(username.toLowerCase()==='admin'){const d=await edge('owner-session',{username,password});if(!d?.session)throw Error('Owner function chưa trả về phiên đăng nhập.');await sb.auth.setSession({access_token:d.session.access_token,refresh_token:d.session.refresh_token});return}else{const r=await sb.auth.signInWithPassword({email:`${username.toLowerCase()}@mathlearn.app`,password});if(r.error)throw r.error}S.authNotice='';return}
if(form.id==='class-form'){const fd=new FormData(form);if(S.modalMode==='create'){const r=await sb.rpc('create_class_with_defaults',{p_name:fd.get('name'),p_avatar_url:null});if(r.error)throw r.error;const file=fd.get('avatar');if(file?.size){const avatar_url=await upload('class-files',`${r.data.id}/avatar/${crypto.randomUUID()}-${file.name}`,file);const up=await sb.from('classes').update({avatar_url}).eq('id',r.data.id);if(up.error)throw up.error}await reloadClasses();S.modal='';await loadClass(r.data.id)}else{const r=await sb.rpc('join_class_by_code',{p_code:String(fd.get('code')).trim().toUpperCase()});if(r.error)throw r.error;await reloadClasses();S.modal='';await loadClass(r.data.id)}return}
if(form.id==='settings-form'){const fd=new FormData(form);let avatar_url=S.cls.avatar_url;const file=fd.get('avatar');if(file?.size)avatar_url=await upload('class-files',`${S.cls.id}/avatar/${crypto.randomUUID()}-${file.name}`,file);const r=await sb.from('classes').update({name:fd.get('name'),avatar_url}).eq('id',S.cls.id);if(r.error)throw r.error;await sb.from('audit_logs').insert({class_id:S.cls.id,actor_id:S.session.user.id,action:'class.updated',details:{name:fd.get('name')}});await reloadClasses();S.cls=S.classes.find(x=>x.id===S.cls.id);S.modal='';render();toast('Đã cập nhật lớp.');return}
if(form.id==='role-form'){const fd=new FormData(form),r=await sb.from('roles').insert({class_id:S.cls.id,name:fd.get('name'),color:fd.get('color'),separate_display:fd.has('separate_display'),can_manage_class:fd.has('can_manage_class'),can_manage_chat:fd.has('can_manage_chat'),can_manage_members:fd.has('can_manage_members'),can_manage_forum:fd.has('can_manage_forum')});if(r.error)throw r.error;await sb.from('audit_logs').insert({class_id:S.cls.id,actor_id:S.session.user.id,action:'role.created',details:{name:fd.get('name')}});await loadClass(S.cls.id);S.modal='settings';render();return}
if(form.id==='channel-form'){const fd=new FormData(form),name=String(fd.get('name')).trim(),r=await sb.from('channels').insert({class_id:S.cls.id,name,slug:safeSlug(name),kind:fd.get('kind'),created_by:S.session.user.id});if(r.error)throw r.error;await sb.from('audit_logs').insert({class_id:S.cls.id,actor_id:S.session.user.id,action:'channel.created',details:{name}});S.modal='';await loadClass(S.cls.id);return}
if(form.id==='post-form'){const fd=new FormData(form);let attachment_path=null;const file=fd.get('file');if(file?.size)attachment_path=await upload('class-files',`${S.cls.id}/posts/${crypto.randomUUID()}-${file.name}`,file);const r=await sb.from('forum_posts').insert({class_id:S.cls.id,channel_id:S.channel.id,author_id:S.session.user.id,title:fd.get('title'),body:fd.get('body'),attachment_path});if(r.error)throw r.error;await sb.from('audit_logs').insert({class_id:S.cls.id,actor_id:S.session.user.id,action:'forum.created',details:{title:fd.get('title')}});S.modal='';await loadChannel();return}
}catch(ex){err(ex)}});

document.addEventListener('input',e=>{if(e.target.id==='draft'){S.draft=e.target.value;mentionSuggestion(S.draft)}if(e.target.matches('[data-submission]'))S.submissionFiles??=new Map(),S.submissionFiles.set(e.target.dataset.submission,e.target.files[0])});
document.addEventListener('keydown',e=>{if(e.target.id==='draft'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}if(e.key==='Escape'&&S.modal){S.modal='';render()}});
async function sendMessage(){const text=$('#draft')?.value.trim();if(!text||!S.channel)return;S.draft='';render();if(S.channel.kind==='ai'){try{const saved=await sb.from('messages').insert({class_id:S.cls.id,channel_id:S.channel.slug,user_id:S.session.user.id,content:text,mentions:extractMentions(text)});if(saved.error)throw saved.error;const thinking={id:crypto.randomUUID(),author:{username:'Gia sư AI'},content:'AI CHAT Thinking...',created_at:new Date().toISOString(),typing:true};S.messages.push(thinking);render();const started=Date.now();const d=await edge('ai-chat',{prompt:text,classId:S.cls.id,channelSlug:S.channel.slug});if(Date.now()-started<2100)await new Promise(r=>setTimeout(r,2100-(Date.now()-started)));thinking.content='';thinking.typing=false;for(const word of d.answer.split(/(\s+)/)){thinking.content+=word;render();await new Promise(r=>setTimeout(r,24))}S.messages=S.messages.filter(m=>m!==thinking);await loadChannel()}catch(e){err(e);S.messages.push({id:crypto.randomUUID(),author:{username:'Gia sư AI'},content:e.message,created_at:new Date().toISOString()});render()}return}let attachment_path=null;try{if(S.pendingFile){const f=S.pendingFile;attachment_path=await upload('class-files',`${S.cls.id}/chat/${S.session.user.id}/${crypto.randomUUID()}-${f.name}`,f);S.pendingFile=null}const r=await sb.from('messages').insert({class_id:S.cls.id,channel_id:S.channel.slug,user_id:S.session.user.id,content:text,attachment_path,mentions:extractMentions(text)});if(r.error)throw r.error}catch(e){err(e)}}
function extractMentions(text){if(/@everyone\b/i.test(text))return S.members.map(m=>m.user_id);return S.members.filter(m=>m.user?.username&&text.toLowerCase().includes('@'+m.user.username.toLowerCase())).map(m=>m.user_id)}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;try{
switch(a){case'auth-toggle':S.role=S.role==='register'?'':'register';S.authNotice='';render();break;
case'logout':await sb.auth.signOut();S.session=null;S.profile=null;S.cls=null;render();break;
case'theme':case'toggle-theme':S.theme=S.theme==='dark'?'light':'dark';localStorage.setItem('lm-theme',S.theme);render();break;
case'class-dialog':S.modal='class';S.modalMode=S.profile?.role==='teacher'||owner()?'create':'join';render();break;case'create-class':S.modal='class';S.modalMode='create';render();break;case'join-class':S.modal='class';S.modalMode='join';render();break;
case'select-class':await loadClass(b.dataset.id);$('#rail').classList.remove('open');if(innerWidth<=760)$('#channels').classList.add('open');break;case'select-channel':S.channel=S.channels.find(x=>x.id===b.dataset.id);await loadChannel();$('#channels').classList.remove('open');break;case'jump-channel':S.channel=S.channels.find(x=>x.id===b.dataset.id);await loadChannel();break;case'jump-post':{const post=S.topics.find(x=>x.id===b.dataset.id);if(post){S.channel=S.channels.find(x=>x.id===post.channel_id);await loadChannel();setTimeout(()=>document.getElementById(`post-${post.id}`)?.scrollIntoView({behavior:'smooth'}),50)}break}
case'reload-classes':await reloadClasses();render();break;case'class-settings':if(!canManage())throw Error('Bạn không có quyền quản lý lớp.');S.modal='settings';render();break;
case'copy-invite':await navigator.clipboard.writeText(S.cls.invite_code);toast('Đã sao chép mã mời.');break;
case'new-channel':if(!canManage())throw Error('Không có quyền tạo kênh.');S.modal='channel';render();break;case'new-post':if(!canForum())throw Error('Không có quyền đăng bài.');S.modal='post';render();break;
case'close-modal':S.modal='';render();break;case'modal-back':if(e.target===b){S.modal='';render()}break;
case'dismiss-role':localStorage.setItem(`lm-role-seen-${S.session?.user?.id}`,'1');S.modal='';render();break;
case'choose-role':{const r=await sb.from('users').update({role:b.dataset.role}).eq('id',S.session.user.id);if(r.error)throw r.error;await refreshProfile();localStorage.setItem(`lm-role-seen-${S.session.user.id}`,'1');S.modal='';render();if(!localStorage.getItem(`lm-tour-${S.session.user.id}`)){S.tour=1;render()}break}
case'next-tour':if(S.tour>=4){S.tour=0;localStorage.setItem(`lm-tour-${S.session.user.id}`,'1')}else S.tour++;render();break;case'skip-tour':S.tour=0;localStorage.setItem(`lm-tour-${S.session.user.id}`,'1');render();break;
case'send':await sendMessage();break;case'insert-math':{const input=$('#draft'),v=b.dataset.value;input.value+=` $${v}$ `;S.draft=input.value;input.focus();break}
case'attach':$('#chat-file').click();break;case'whiteboard':S.modal='whiteboard';render();setupCanvas();break;case'clear-board':setupCanvas();break;case'send-board':{const canvas=$('#board');const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));S.pendingFile=new File([blob],'whiteboard.png',{type:'image/png'});S.draft='Bảng vẽ hình học';S.modal='';render();await sendMessage();break}
case'mobile-rail':if(S.cls){$('#rail').classList.remove('open');$('#channels').classList.toggle('open')}else $('#rail').classList.toggle('open');break;case'show-members':toast('Danh sách thành viên ở bảng bên phải.');break;
case'pick-mention':{const input=$('#draft'),value=input.value.replace(/(?:^|\s)([@#][^\s]*)$/,' $1');input.value=value.replace(/[@#][^\s]*$/,'')+b.dataset.value+' ';S.draft=input.value;$('#suggestion').classList.add('hidden');input.focus();break}
case'manage-member':S.targetMember=b.dataset.id;S.modal='member';render();break;
case'assign-role':{const roleId=$('#member-role').value||null,r=await sb.from('class_members').update({role_id:roleId,class_role:roleId?'custom':'student'}).eq('class_id',S.cls.id).eq('user_id',b.dataset.id);if(r.error)throw r.error;await sb.from('audit_logs').insert({class_id:S.cls.id,actor_id:S.session.user.id,action:'member.role_changed',details:{user_id:b.dataset.id,role_id:roleId}});S.modal='';await loadClass(S.cls.id);break}
case'mute-member':case'kick-member':case'ban-member':{const action={ 'mute-member':'mute','kick-member':'kick','ban-member':'ban'}[a];const r=await sb.rpc('manage_member_action',{p_class_id:S.cls.id,p_user_id:b.dataset.id,p_action:action,p_minutes:10});if(r.error)throw r.error;S.modal='';await loadClass(S.cls.id);toast('Đã cập nhật thành viên.');break}
case'delete-message':{const r=await sb.from('messages').delete().eq('id',b.dataset.id);if(r.error)throw r.error;break}
case'pin-message':{const msg=S.messages.find(m=>m.id===b.dataset.id);if(!msg)break;const r=await sb.from('messages').update({pinned:!msg.pinned}).eq('id',msg.id);if(r.error)throw r.error;break}
case'forum-reply':{const input=$(`#reply-${b.dataset.id}`),text=input?.value.trim();if(!text)throw Error('Nhập nội dung phản hồi.');const r=await sb.from('messages').insert({class_id:S.cls.id,channel_id:`forum-${b.dataset.id}`,user_id:S.session.user.id,content:text});if(r.error)throw r.error;await loadChannel();break}
case'load-audit':{const r=await sb.from('audit_logs').select('*,actor:users!audit_logs_actor_id_fkey(username)').eq('class_id',S.cls.id).order('created_at',{ascending:false}).limit(100);if(r.error)throw r.error;S.auditLogs=r.data||[];S.modal='audit';render();break}
case'file-download':{e.preventDefault();const win=window.open('about:blank','_blank');const r=await sb.storage.from(b.dataset.bucket).createSignedUrl(b.dataset.path,300);if(r.error){win?.close();throw r.error}if(win)win.location=r.data.signedUrl;else location.href=r.data.signedUrl;break}
case'submit-work':{const file=S.submissionFiles?.get(b.dataset.id);if(!file)throw Error('Chọn tệp bài làm trước.');const path=`${S.cls.id}/${b.dataset.id}/${S.session.user.id}/${crypto.randomUUID()}-${file.name}`;await upload('submissions',path,file);const r=await sb.from('submissions').upsert({post_id:b.dataset.id,student_id:S.session.user.id,storage_path:path},{onConflict:'post_id,student_id'});if(r.error)throw r.error;toast('Đã nộp bài.');break}
case'load-submissions':await showSubmissions(b.dataset.id);break;
case'grade':{const form=b.closest('[data-grade]'),r=await sb.from('submissions').update({grade:Number(form.querySelector('[name=grade]').value),feedback:form.querySelector('[name=feedback]').value,graded_by:S.session.user.id,graded_at:new Date().toISOString()}).eq('id',form.dataset.grade);if(r.error)throw r.error;toast('Đã lưu điểm và nhận xét.');break}
case'delete-class':if(!confirm('Xóa lớp và toàn bộ dữ liệu của lớp?'))break;{const r=await sb.from('classes').delete().eq('id',S.cls.id);if(r.error)throw r.error;S.cls=null;S.modal='';await reloadClasses();render();break}
}}
catch(ex){err(ex)}});
document.addEventListener('change',e=>{if(e.target.id==='chat-file'){S.pendingFile=e.target.files[0];if(S.pendingFile){const d=$('#draft');d.value=`Đính kèm: ${S.pendingFile.name}`;S.draft=d.value}}if(e.target.matches('[data-submission]')){S.submissionFiles??=new Map();S.submissionFiles.set(e.target.dataset.submission,e.target.files[0])}});
async function showSubmissions(postId){const r=await sb.from('submissions').select('*,student:users!submissions_student_id_fkey(username)').eq('post_id',postId).order('submitted_at',{ascending:false});if(r.error)throw r.error;const slot=$(`#grades-${postId}`);slot.innerHTML=r.data?.length?r.data.map(x=>`<div class="grade-row" data-grade="${x.id}"><b>${esc(x.student?.username||'Học sinh')}</b> · ${new Date(x.submitted_at).toLocaleString('vi-VN')} ${x.storage_path?`<a href="#" data-action="file-download" data-bucket="submissions" data-path="${esc(x.storage_path)}">Mở bài</a>`:''}<div><input name="grade" type="number" min="0" max="10" step="0.25" value="${x.grade??''}" placeholder="Điểm /10"><textarea name="feedback" placeholder="Nhận xét">${esc(x.feedback||'')}</textarea><button class="secondary" data-action="grade">Lưu điểm</button></div></div>`).join(''):'<div class="empty">Chưa có bài nộp.</div>'}

sb.auth.getSession().then(async({data})=>{S.session=data.session;if(S.session){try{await refreshProfile();await reloadClasses();if(S.profile?.role==='pending'&&!localStorage.getItem(`lm-role-seen-${S.session?.user?.id}`)){S.modal='role'}if(S.classes.length)await loadClass(S.classes[0].id);else render();if(!localStorage.getItem(`lm-tour-${S.session.user.id}`)&&!S.modal){S.tour=1;render()}}catch(e){err(e);render()}}else render()});
sb.auth.onAuthStateChange(async(_event,session)=>{S.session=session;if(session){try{await refreshProfile();await reloadClasses();if(!S.modal&&S.profile.role==='pending'&&!localStorage.getItem(`lm-role-seen-${session?.user?.id}`))S.modal='role';if(S.classes.length&&!S.cls)await loadClass(S.classes[0].id);else render()}catch(e){err(e)}}else{S.profile=null;S.classes=[];S.cls=null;render()}});
</script></body></html>
